<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFFBF9">
<title>아빠 전용 투자 · 부동산 브리핑</title>
<meta name="description" content="아버님을 위한 매일 코인·주식 시황과 매주 명지 부동산 리포트 — 우리집(엘크루 솔마레 106동 806호) 시세, 경쟁 단지 비교, 3단계 매도 전략.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="아빠 브리핑">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<a class="skip-link" href="#main">본문으로 바로 가기</a>

<header class="app-header" id="app-header">
  <div class="wrap header-inner">
    <div class="brand-row">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">📊</span>
        <div class="brand-text">
          <p class="brand-kicker">매일 갱신 · 아버님 전용</p>
          <h1 class="brand-title">아빠 전용 투자 · 부동산 브리핑</h1>
        </div>
      </div>
      <button type="button" class="icon-btn" id="theme-toggle" aria-label="다크 모드로 전환">
        <span aria-hidden="true">🌙</span>
      </button>
    </div>
  </div>
</header>

<div class="filter-bar" id="filter-bar">
  <div class="wrap">
    <form class="search" id="search-form" role="search">
      <span class="search-icon" aria-hidden="true">🔍</span>
      <label class="visually-hidden" for="search-input">브리핑 키워드 검색</label>
      <input
        type="search"
        id="search-input"
        name="q"
        placeholder="키워드 검색 — 비트코인, 코스피, 엘크루…"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        enterkeyhint="search">
      <button type="button" class="search-clear" id="search-clear" aria-label="검색어 지우기" hidden>✕</button>
    </form>

    <nav class="tabs" id="tabs" aria-label="카테고리 필터"></nav>
    <nav class="dates" id="dates" aria-label="날짜 선택"></nav>
  </div>
</div>

<main id="main" class="wrap" tabindex="-1">
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <div id="view"></div>
</main>

<footer class="app-footer wrap">
  <p class="footer-meta" id="footer-meta">불러오는 중…</p>
  <p class="footer-note">
    이 페이지는 아버님 한 분을 위해 만든 개인 브리핑입니다. 코인·주식은 매일, 부동산 리포트는 매주 갱신되고,
    모든 수치는 원문 출처와 확인 시각을 함께 적었습니다. 투자 판단의 근거로 쓰기 전에는 링크에서 최신 값을 다시 확인하세요.
  </p>
  <p class="footer-note footer-note--dim">
    <a href="./data/dad-briefs.json">dad-briefs.json</a> · GitHub Pages 정적 배포용
  </p>
</footer>

<!-- file:// 로 열 때 fetch가 막히는 경우를 위한 오프라인 사본 (build_briefs.py가 생성) -->
<script src="./data/dad-briefs.js" defer></script>
<script src="./app.js" defer></script>
</body>
</html>
