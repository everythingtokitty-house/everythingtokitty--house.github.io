<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFFBF9">
<title>모닝 트렌드 브리핑 · 마케터 AI 브리핑 아카이브</title>
<meta name="description" content="매일 아침 8시, 국내 화제·마케터 뉴스·AI 정보를 한 장에 정리한 마케터 모닝 트렌드 브리핑 아카이브. 산리오(헬로키티) 콜라보 소식과 8대 캐릭터 콜라보 전체 사이트까지. 날짜·카테고리·키워드로 검색.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="모닝 브리핑">
<link rel="stylesheet" href="./styles.css?v=20261126c">
</head>
<body>
<a class="skip-link" href="#main">본문으로 바로 가기</a>

<header class="app-header" id="app-header">
  <div class="wrap header-inner">
    <div class="brand-row">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🔥</span>
        <div class="brand-text">
          <p class="brand-kicker">마케터 모닝 트렌드</p>
          <p class="brand-title">AI 브리핑 아카이브</p>
        </div>
      </div>
      <button type="button" class="icon-btn" id="theme-toggle" aria-label="다크 모드로 전환">
        <span aria-hidden="true">🌙</span>
      </button>
    </div>
  </div>
</header>

<div class="filter-bar" id="filter-bar">
  <div class="wrap">
    <form class="search" id="search-form" role="search">
      <span class="search-icon" aria-hidden="true">🔍</span>
      <label class="visually-hidden" for="search-input">브리핑 키워드 검색</label>
      <input
        type="search"
        id="search-input"
        name="q"
        placeholder="키워드 검색 — 배민, 마운자로, 클로드…"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        enterkeyhint="search">
      <button type="button" class="search-clear" id="search-clear" aria-label="검색어 지우기" hidden>✕</button>
    </form>

    <nav class="tabs" id="tabs" aria-label="카테고리 필터"></nav>
    <nav class="dates" id="dates" aria-label="날짜 선택"></nav>
  </div>
</div>

<main id="main" class="wrap" tabindex="-1">
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <div id="results"></div>
</main>

<footer class="app-footer wrap">
  <p class="footer-meta" id="footer-meta">불러오는 중…</p>
  <p class="footer-note">
    매일 아침 8시에 만든 브리핑을 그대로 모은 아카이브입니다. 원문의 출처 링크와 확인 시각을 함께 남겼으니,
    인용 전에는 링크에서 최신 수치를 다시 확인하세요.
  </p>
  <p class="footer-note footer-note--dim">
    <a href="./data/briefs.json">briefs.json</a> · GitHub Pages 정적 배포용
  </p>
</footer>

<!-- file:// 로 열 때 fetch가 막히는 경우를 위한 오프라인 사본 (build_briefs.py가 생성) -->
<script src="./data/briefs.js" defer></script>
<script src="./app.js?v=20261126c" defer></script>
</body>
</html>
