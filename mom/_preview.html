<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모바일 미리보기 (390px)</title>
<style>
  html,body{margin:0;background:#efe7dd}
  body{display:flex;flex-direction:column;align-items:center;padding:16px 0 40px;font-family:sans-serif}
  .cap{font:700 13px/1.4 sans-serif;color:#7a5a3f;margin-bottom:10px}
  iframe{width:390px;border:0;display:block;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.16)}
</style></head>
<body>
<div class="cap">390px 미리보기 (검수용)</div>
<iframe id="f" src="./index.html" title="390px 미리보기"></iframe>
<script>
  var f = document.getElementById("f");
  function fit() {
    try {
      var d = f.contentDocument;
      f.style.height = Math.max(d.documentElement.scrollHeight, d.body.scrollHeight) + "px";
    } catch (e) {}
  }
  f.addEventListener("load", function () { fit(); setTimeout(fit, 400); setTimeout(fit, 1200); });
</script>
</body></html>
